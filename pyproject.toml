[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm-d5"
version = "0.3.0"
description = "Read-only J1939 / UDS / OBD diagnostics for the MCM D5 platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
can = ["python-can>=4.0"]
dbc = ["cantools>=38.0"]
dev = ["pytest>=7.0", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
mcm-d5 = "mcm_d5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
explicit_package_bases = true
packages = ["mcm_d5"]
ignore_missing_imports = true
